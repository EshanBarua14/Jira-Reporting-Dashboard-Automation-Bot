<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eshan Barua's OmniSync Suite</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="theme-color" content="#4F46E5" />
    <script>
      // Safe development/preview service worker lifecycle
      if ("serviceWorker" in navigator) {
        if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.hostname.includes("run.app") || window.location.port !== "") {
          // In development/container preview, unregister stale service workers to prevent cache collisions
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister().catch(() => {});
            }
          }).catch(() => {});
        } else {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("/sw.js").catch(() => {});
          });
        }
      }
    </script>
    <style>
      @keyframes omnisync-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.95); }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background-color:#020617;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;">
    <div id="boot-status" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;width:100vw;position:fixed;top:0;left:0;z-index:99999;background-color:#020617;color:#94a3b8;gap:16px;">
      <div style="width:36px;height:36px;border:3px solid #1e293b;border-top-color:#6366f1;border-radius:50%;animation:omnisync-spin 0.8s linear infinite;"></div>
      <div style="font-size:14px;font-weight:600;letter-spacing:0.025em;color:#e2e8f0;">Loading OmniSync Suite…</div>
      <div style="font-size:11px;color:#64748b;font-family:monospace;">Initializing dashboard components</div>
    </div>
    <style>
      @keyframes omnisync-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
